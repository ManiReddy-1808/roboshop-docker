services:
  catalogue:
    build: ./catalogue
    image: manikanta1808/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build: ./user
    image: manikanta1808/user:1.0.0
    container_name: user
    depends_on:
    - redis
  frontend:
    build: ./frontend
    image: manikanta1808/frontend:1.0.0
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user

  mongodb:
    build: ./mongodb
    image: manikanta1808/mongodb:1.0.0
    container_name: mongodb
  redis:
    image: redis:7.0
    container_name: redis
  
networks:
  default:
    driver: bridge
    name: roboshop
    external: false #If true, we need to create the n/w manually